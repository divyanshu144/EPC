version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ewhei-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-epc}
      POSTGRES_USER: ${POSTGRES_USER:-epc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epc}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epc} -d ${POSTGRES_DB:-epc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: ewhei-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts

  notebook:
    build: .
    container_name: ew-notebook
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-lab}
      - EPC_EMAIL=${EPC_EMAIL}
      - EPC_API_KEY=${EPC_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./notebooks:/work/notebooks
      - ./scripts:/work/scripts
      - ./data:/work/data
      - ./reports:/work/reports
      - ./logs:/work/logs
      - ./.env:/work/.env:ro
    # uncomment on Apple Silicon if you hit binary issues
    # platform: linux/amd64

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ewhei-api
    ports:
      - "8001:8000"
    volumes:
      - ./data/processed:/app/data/processed
      - ./reports/artifacts:/app/reports/artifacts

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: ewhei-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data/processed:/app/data/processed
      - ./reports/artifacts:/app/reports/artifacts

volumes:
  postgres-data:
