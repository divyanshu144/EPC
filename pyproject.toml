[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ew-housing-energy-impact"
version = "0.1.0"
description = "Reproducible EPC analysis pipeline for UK housing energy performance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=18.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "shap>=0.46",
    "linearmodels>=7.0",
    "xgboost>=3.0",
    "joblib>=1.4",
    "streamlit>=1.41",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.10",
    "prefect>=2.20,<3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "mlflow>=2.18",
    "boto3>=1.35",
    "snowflake-connector-python>=3.12",
]

[project.scripts]
ewhei = "ew_housing_energy_impact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "notebooks",
    ".git",
    ".pytest_cache",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    # The CLI intentionally mutates sys.path before imports so the installed
    # console script can reach root-level pipeline modules.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:rerunfailures"
